services:
  gateway:
    # Keep the application gateway private even if HTTP_BIND is changed in .env.
    ports: !override
      - "127.0.0.1:8080:80"
  edge:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    volumes:
      - ${PUBLIC_NGINX_CONFIG:-./infra/public/nginx-https.conf}:/etc/nginx/conf.d/default.conf:ro
      - /var/lib/gastrogid/tls/webroot:/var/www/certbot:ro
      - /var/lib/gastrogid/tls/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      gateway:
        condition: service_started
  certbot:
    image: certbot/certbot:v5.8.0
    profiles: ["tls-maintenance"]
    volumes:
      - /var/lib/gastrogid/tls/webroot:/var/www/certbot
      - /var/lib/gastrogid/tls/letsencrypt:/etc/letsencrypt
      - /var/lib/gastrogid/tls/work:/var/lib/letsencrypt
      - /var/lib/gastrogid/tls/logs:/var/log/letsencrypt
