map $http_x_api_key $team_api_authorized {
    default 0;
    # Missing configuration fails closed at startup. This generated include
    # uses a case-sensitive anchored regex, not case-insensitive map strings.
    include /etc/gastrogid/team-api-key.map;
}

map $team_api_authorized $team_docs_auth_realm {
    default "GastroGuide team";
    1 off;
}

map $http_authorization $upstream_authorization {
    default $http_authorization;
    ~*^Basic "";
}

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://90.156.213.217$request_uri; }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name 90.156.213.217;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/gastrogid-public/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gastrogid-public/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options nosniff always;

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $gateway gateway:80;
    client_max_body_size 20m;
    proxy_connect_timeout 5s;
    proxy_read_timeout 90s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-API-Key "";
    proxy_set_header Authorization $upstream_authorization;
    # Uvicorn trusts loopback proxies by default; rewrite its slash redirects
    # here without widening trust to every application-network peer.
    proxy_redirect http://$host/ https://$host/;

    location = / {
        auth_basic $team_docs_auth_realm;
        auth_basic_user_file /etc/gastrogid/docs.htpasswd;
        # Proxy rather than return: Basic authentication runs in the access
        # phase, after an immediate rewrite-phase return would already exit.
        proxy_pass http://$gateway;
    }
    location = /health {
        default_type application/json;
        if ($team_api_authorized = 0) {
            return 403 '{"code":"invalid_api_key","message":"Укажите правильный командный API-ключ.","request_id":"$request_id","details":null}';
        }
        return 200 '{"status":"ok","service":"public-gateway"}';
    }
    # Block private service operations even if an application adds a new route.
    location = /api/v1/internal { return 404; }
    location ^~ /api/v1/internal/ { return 404; }
    location /api/v1/ {
        default_type application/json;
        if ($team_api_authorized = 0) {
            return 403 '{"code":"invalid_api_key","message":"Укажите правильный командный API-ключ.","request_id":"$request_id","details":null}';
        }
        proxy_pass http://$gateway;
    }
    location /docs/ {
        auth_basic $team_docs_auth_realm;
        auth_basic_user_file /etc/gastrogid/docs.htpasswd;
        proxy_pass http://$gateway;
    }
    location ~ ^/openapi/(catalog|users|recommendations)\.json$ {
        auth_basic $team_docs_auth_realm;
        auth_basic_user_file /etc/gastrogid/docs.htpasswd;
        proxy_pass http://$gateway;
    }
    location / { return 404; }
}
