server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://90.156.213.217$request_uri; }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name 90.156.213.217;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/gastrogid-public/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gastrogid-public/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options nosniff always;

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $gateway gateway:80;
    client_max_body_size 20m;
    proxy_connect_timeout 5s;
    proxy_read_timeout 90s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    # Uvicorn trusts loopback proxies by default; rewrite its slash redirects
    # here without widening trust to every application-network peer.
    proxy_redirect http://$host/ https://$host/;

    location = / { return 302 /docs/; }
    location = /health {
        default_type application/json;
        return 200 '{"status":"ok","service":"public-gateway"}';
    }
    # Block private service operations even if an application adds a new route.
    location = /api/v1/internal { return 404; }
    location ^~ /api/v1/internal/ { return 404; }
    location /api/v1/ { proxy_pass http://$gateway; }
    location /docs/ { proxy_pass http://$gateway; }
    location ~ ^/openapi/(catalog|users|recommendations)\.json$ { proxy_pass http://$gateway; }
    location / { return 404; }
}
