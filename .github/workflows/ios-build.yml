name: iOS build

'on':
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Foundation tests and iOS Simulator build
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run Foundation API tests
        shell: bash
        run: swift test --package-path ios/GastroAPI
      - name: Build SwiftUI app for iOS Simulator
        shell: bash
        run: >-
          xcodebuild
          -project ios/GastroGuide/GastroGuide.xcodeproj
          -scheme GastroGuide
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build/DerivedData
          CODE_SIGNING_ALLOWED=NO
          build
