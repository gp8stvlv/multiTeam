server {
    listen 80;
    server_name _;
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $catalog catalog:8001;
    set $users users:8002;
    set $recommendations recommendations:8003;
    client_max_body_size 20m;
    proxy_connect_timeout 5s;
    proxy_read_timeout 90s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    location = / { return 302 /docs/; }
    location /docs/ { alias /usr/share/nginx/html/; index index.html; }
    location = /health { default_type application/json; return 200 '{"status":"ok","service":"gateway"}'; }
    location = /health/catalog { proxy_pass http://$catalog/health; }
    location = /health/users { proxy_pass http://$users/health; }
    location = /health/recommendations { proxy_pass http://$recommendations/health; }
    location = /ready/catalog { proxy_pass http://$catalog/ready; }
    location = /ready/users { proxy_pass http://$users/ready; }
    location = /ready/recommendations { proxy_pass http://$recommendations/ready; }
    location = /openapi/catalog.json { proxy_pass http://$catalog/openapi.json; }
    location = /openapi/users.json { proxy_pass http://$users/openapi.json; }
    location = /openapi/recommendations.json { proxy_pass http://$recommendations/openapi.json; }
    location /api/v1/internal/ { return 404; }
    location ~ ^/api/v1/(recommendations|me/feed)(/|$) { proxy_pass http://$recommendations; }
    location ~ ^/api/v1/(auth|nutrition|me)(/|$) { proxy_pass http://$users; }
    location /api/v1/ { proxy_pass http://$catalog; }
}
