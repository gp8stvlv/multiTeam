    Feedback:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        dish_id: *id035
        recommendation_id: *id036
        rating: *id037
        comment: *id038
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - user_id
      - dish_id
      - rating
      - updated_at
    RecommendationCreate:
      type: object
      additionalProperties: false
      properties:
        mode:
          type: string
          enum:
          - dish_search
          - meal_plan
        query:
          type: string
          minLength: 1
          maxLength: 2000
        constraints:
          $ref: '#/components/schemas/Constraints'
        max_options:
          type: integer
          minimum: 1
          maximum: 5
          default: 3
        context_request_id:
          type: string
          format: uuid
          nullable: true
      required:
      - mode
      - query
      description: user_id берётся из JWT. context_request_id связывает новый запрос с предыдущим и должен принадлежать
        пользователю. Дневник, профиль и аллергии загружаются сервером; их нельзя подменить в теле запроса.
    RecommendationOptionItem:
      type: object
      additionalProperties: false
      properties:
        menu_item_id:
          type: string
          format: uuid
        dish_id:
          type: string
          format: uuid
        name:
          type: string
        portions:
          type: integer
          minimum: 1
          maximum: 20
          description: Число заказываемых стандартных порций. Доли порций используются только в дневнике и расчёте
            съеденного.
        unit_price_minor:
          type: integer
          minimum: 0
          description: 'Сумма в минимальных единицах валюты. Для RUB: копейки; 900 ₽ = 90000.'
        nutrition_per_portion:
          $ref: '#/components/schemas/NutritionFacts'
      required:
      - menu_item_id
      - dish_id
      - name
      - portions
      - unit_price_minor
      - nutrition_per_portion
    RecommendationOption:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        rank:
          type: integer
          minimum: 1
        restaurant:
          $ref: '#/components/schemas/Restaurant'
        items:
          type: array
          items:
            $ref: '#/components/schemas/RecommendationOptionItem'
          minItems: 1
        total_price_minor:
          type: integer
          minimum: 0
          description: 'Сумма в минимальных единицах валюты. Для RUB: копейки; 900 ₽ = 90000.'
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        nutrition:
          $ref: '#/components/schemas/NutritionTotals'
        reasons:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string
        evidence_ids:
          type: array
          items:
            type: string
            format: uuid
      required:
      - id
      - rank
      - restaurant
      - items
      - total_price_minor
      - currency
      - nutrition
      - reasons
      - warnings
      - evidence_ids
    Clarification:
      type: object
      additionalProperties: false
      properties:
        field:
          type: string
        question:
          type: string
        suggested_values:
          type: array
          items:
            type: string
      required:
      - field
      - question
    RecommendationResult:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        outcome:
          type: string
          enum:
          - ready
          - needs_clarification
          - no_matches
        options:
          type: array
          items:
            $ref: '#/components/schemas/RecommendationOption'
        clarifications:
          type: array
          items:
            $ref: '#/components/schemas/Clarification'
        warnings:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
      required:
      - id
      - outcome
      - options
      - clarifications
      - warnings
      - created_at
      description: 'ready: options не пустой; needs_clarification: clarifications не пустой, options пустой; no_matches:
        options пустой и объяснение в warnings. Все варианты одного результата удовлетворяют обязательным ограничениям.'
    RecommendationRun:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - queued
          - running
          - completed
          - failed
        trigger:
          type: string
          enum:
          - manual
          - proactive
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        result:
          $ref: '#/components/schemas/RecommendationResult'
        error:
          $ref: '#/components/schemas/Error'
      required:
      - id
      - status
      - trigger
      - created_at
      - updated_at
      description: Асинхронный запуск. completed требует result; failed требует error. Для queued/running result
        и error отсутствуют. Поллинг по Location, не чаще Retry-After.
      example:
        id: 00000000-0000-4000-8000-000000000012
        status: completed
        trigger: manual
        created_at: '2026-10-11T10:30:00Z'
        updated_at: '2026-10-11T10:30:00Z'
        result:
          id: 00000000-0000-4000-8000-000000000013
          outcome: ready
          options:
          - id: 00000000-0000-4000-8000-000000000015
            rank: 1
            restaurant: *id039
            items:
            - menu_item_id: 20000000-0000-4000-8000-000000000001
              dish_id: 00000000-0000-4000-8000-000000000003
              name: 'Демо: хинкали, 4 шт.'
              portions: 1
              unit_price_minor: 75000
              nutrition_per_portion: *id024
            total_price_minor: 75000
            currency: RUB
            nutrition: *id040
            reasons:
            - В пределах заданных 900 ₽ и 650 ккал.
            - Ресторан в 700 м по прямой.
            warnings:
            - Сведения об аллергенах неполные.
            evidence_ids:
            - 00000000-0000-4000-8000-000000000009
          clarifications: []
          warnings:
          - Все данные примера демонстрационные.
          created_at: '2026-10-11T10:30:00Z'
    AgentRun:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        agent:
          type: string
          enum:
          - coordinator
          - search
          - nutrition
          - planner
          - validator
        status:
          type: string
          enum:
          - running
          - completed
          - failed
          - skipped
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          nullable: true
        tool_names:
          type: array
          items:
            type: string
        evidence_ids:
          type: array
          items:
            type: string
            format: uuid
        summary:
          type: string
        input_tokens:
          type: integer
          minimum: 0
        output_tokens:
          type: integer
          minimum: 0
      required:
      - id
      - agent
      - status
      - started_at
      - tool_names
      - evidence_ids
      - summary
      - input_tokens
      - output_tokens
      description: Техническая трасса с фактами и вызванными инструментами. Без скрытых рассуждений модели, токенов
        авторизации и сырых персональных данных.
    TraceResponse:
      type: object
      additionalProperties: false
      properties:
        recommendation_id:
          type: string
          format: uuid
        runs:
          type: array
          items:
            $ref: '#/components/schemas/AgentRun'
      required:
      - recommendation_id
      - runs
    FeedItem:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        recommendation_id:
          type: string
          format: uuid
        title:
          type: string
        status:
          type: string
          enum:
          - unread
          - read
          - dismissed
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
      required:
      - id
      - recommendation_id
      - title
      - status
      - created_at
      - expires_at
    FeedPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FeedItem'
        total:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
        offset:
          type: integer
          minimum: 0
      required:
      - items
      - total
      - limit
      - offset
    FeedItemPatch:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
          - read
          - dismissed
      required:
      - status
