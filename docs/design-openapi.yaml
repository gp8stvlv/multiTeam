openapi: 3.0.3
info:
  title: ГастроГид — API Gateway
  version: 0.1.0
  description: 'Проектный контракт учебного MVP. Три сервиса: Catalog, User & Nutrition, Recommendation. Это документация
    будущего API; backend не реализован. ID — UUID, время — RFC 3339 с часовым поясом, деньги — целые минимальные
    единицы валюты. КБЖУ на одну порцию; null означает отсутствие данных. user_id определяется JWT. Межсервисные
    ID проверяются через API, а не межбазовые FK. Ограничения доступа из x-roles — требования к серверу, Swagger
    сам их не обеспечивает.'
servers:
- url: http://localhost:8000/api/v1
  description: Планируемый локальный API Gateway, после реализации backend
security:
- bearerAuth: []
tags:
- name: Аккаунт
- name: Профиль
- name: Каталог
- name: Поиск
- name: Администрирование меню
- name: Дневник
- name: Питание
- name: Обратная связь
- name: Рекомендации
- name: Трассировка агентов
- name: Проактивная лента
paths:
  /auth/register:
    post:
      operationId: register
      tags:
      - Аккаунт
      summary: Создать аккаунт
      description: ''
      x-service: users
      x-roles:
      - user
      - admin
      responses:
        '201':
          description: Операция выполнена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
  /auth/login:
    post:
      operationId: login
      tags:
      - Аккаунт
      summary: Войти
      description: ''
      x-service: users
      x-roles:
      - user
      - admin
      responses:
        '200':
          description: Операция выполнена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Error401'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
  /me/profile:
    get:
      operationId: getProfile
      tags:
      - Профиль
      summary: Получить свой профиль
      description: ''
      x-service: users
      x-roles:
      - user
      - admin
      responses:
        '200':
          description: Операция выполнена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/Error401'
    patch:
      operationId: updateProfile
      tags:
      - Профиль
      summary: Изменить профиль и ограничения
      description: ''
      x-service: users
      x-roles:
      - user
      - admin
      responses:
        '200':
          description: Операция выполнена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/Error401'
        '422':
          $ref: '#/components/responses/Error422'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfilePatch'
  /restaurants:
    get:
      operationId: listRestaurants
      tags:
      - Каталог
      summary: Список ресторанов
      description: latitude и longitude передаются вместе. radius_m и sort=distance требуют координат. Расстояние
        по прямой, без расчёта маршрута. Показываются активные рестораны.
      x-service: catalog
      x-roles:
      - user
      - admin
      responses:
        '200':
          description: Операция выполнена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestaurantPage'
        '401':
          $ref: '#/components/responses/Error401'
        '422':
          $ref: '#/components/responses/Error422'
      parameters:
      - &id001
        $ref: '#/components/parameters/Limit'
      - &id002
        $ref: '#/components/parameters/Offset'
      - name: latitude
        in: query
        required: false
        schema:
          type: number
          minimum: -90
          maximum: 90
      - name: longitude
        in: query
        required: false
        schema:
          type: number
          minimum: -180
          maximum: 180
      - name: radius_m
        in: query
        required: false
        schema:
          type: integer
          minimum: 100
          maximum: 100000
      - name: cuisine
        in: query
        required: false
        schema:
          type: string
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
          - distance
          - rating
          - name
          default: name
    post:
      operationId: createRestaurant
      tags:
      - Администрирование меню
      summary: Создать ресторан
      description: ' Доступ: только admin; роль проверяется сервером.'
      x-service: catalog
      x-roles:
      - admin
      responses:
        '201':
          description: Операция выполнена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Restaurant'
        '401':
          $ref: '#/components/responses/Error401'
        '422':
          $ref: '#/components/responses/Error422'
        '403':
          $ref: '#/components/responses/Error403'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestaurantCreate'
  /restaurants/{restaurant_id}:
    get:
      operationId: getRestaurant
      tags:
      - Каталог
      summary: Карточка ресторана
      description: ''
      x-service: catalog
      x-roles:
      - user
      - admin
      responses:
        '200':
          description: Операция выполнена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Restaurant'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
      parameters:
      - name: restaurant_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateRestaurant
      tags:
      - Администрирование меню
      summary: Изменить ресторан
      description: ' Доступ: только admin; роль проверяется сервером.'
      x-service: catalog
      x-roles:
      - admin
      responses:
        '200':
          description: Операция выполнена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Restaurant'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
        '403':
          $ref: '#/components/responses/Error403'
      parameters:
      - name: restaurant_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestaurantPatch'
  /restaurants/{restaurant_id}/menu:
    get:
      operationId: getActiveMenu
      tags:
      - Каталог
      summary: Активная версия меню
      description: 404, если опубликованного меню нет. Новая публикация архивирует предыдущее меню; его позиции
        остаются доступны по ID.
      x-service: catalog
      x-roles:
      - user
      - admin
      responses:
        '200':
          description: Операция выполнена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuResponse'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
      parameters:
      - name: restaurant_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /restaurants/{restaurant_id}/reviews:
    get:
      operationId: listReviews
      tags:
      - Каталог
      summary: Отзывы о ресторане
      description: ''
      x-service: catalog
      x-roles:
      - user
      - admin
      responses:
        '200':
          description: Операция выполнена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewPage'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
      parameters:
      - name: restaurant_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - *id001
      - *id002
  /dishes/{dish_id}:
    get:
      operationId: getDish
      tags:
      - Каталог
      summary: Стабильная карточка блюда
      description: ID блюда сохраняется между версиями меню. Для цены и КБЖУ используется конкретная MenuItem.
      x-service: catalog
      x-roles:
      - user
      - admin
      responses:
        '200':
          description: Операция выполнена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dish'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
      parameters:
      - name: dish_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /menu-items/{menu_item_id}:
    get:
      operationId: getMenuItem
      tags:
      - Каталог
      summary: Позиция конкретной версии меню
      description: Доступны опубликованные и архивные позиции. Архивная позиция не участвует в поиске новых заказов.
      x-service: catalog
      x-roles:
      - user
      - admin
      responses:
        '200':
          description: Операция выполнена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuItem'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
      parameters:
      - name: menu_item_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /menu-versions/{menu_version_id}:
    get:
      operationId: getMenuVersion
      tags:
      - Каталог
      summary: Меню по версии
      description: ''
      x-service: catalog
      x-roles:
      - user
      - admin
      responses:
        '200':
          description: Операция выполнена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuResponse'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
      parameters:
      - name: menu_version_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /evidence/{evidence_id}:
    get:
      operationId: getEvidence
      tags:
      - Каталог
      summary: Фрагмент источника рекомендации
      description: ''
      x-service: catalog
      x-roles:
      - user
      - admin
      responses:
        '200':
          description: Операция выполнена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evidence'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
      parameters:
      - name: evidence_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /search:
    post:
      operationId: searchMenu
      tags:
      - Поиск
      summary: Поиск по меню и ресторанам
      description: Структурированные фильтры + семантический поиск по активным меню. Аллергии профиля добавляются
        сервером. При обязательных ограничениях кандидаты с недостаточными данными не возвращаются как подходящие.
      x-service: catalog
      x-roles:
      - user
      - admin
      responses:
        '200':
          description: Операция выполнена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '401':
          $ref: '#/components/responses/Error401'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
            example:
              query: Хочу хинкали, не острые
              constraints:
                near:
                  point:
                    latitude: 55.7558
                    longitude: 37.6173
                  radius_m: 2000
                budget_minor: 90000
                currency: RUB
              limit: 10
  /menu-imports:
    post:
      operationId: createMenuImport
      tags:
      - Администрирование меню
      summary: Загрузить HTML, PDF или фото меню
      description: 'Фоновая обработка. Тип и размер файла проверяются сервером; лимит 20 MiB. Результат требует
        проверки администратором. Произвольные URL сервер не скачивает. Доступ: только admin; роль проверяется сервером.'
      x-service: catalog
      x-roles:
      - admin
      responses:
        '202':
          description: Задача принята. Ответ не является готовым результатом.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuImport'
              example:
                id: 00000000-0000-4000-8000-000000000020
                restaurant_id: 00000000-0000-4000-8000-000000000001
                source_kind: pdf
                filename: demo-menu.pdf
                status: queued
                progress_percent: 0
                created_at: '2026-10-11T10:30:00Z'
                updated_at: '2026-10-11T10:30:00Z'
          headers:
            Location:
              schema:
                type: string
              description: URL проверки задачи.
            Retry-After:
              schema:
                type: integer
                minimum: 1
              description: Минимальный интервал поллинга в секундах.
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
        '503':
          $ref: '#/components/responses/Error503'
        '403':
          $ref: '#/components/responses/Error403'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              properties:
                restaurant_id:
                  type: string
                  format: uuid
                source_kind:
                  type: string
                  enum:
                  - html
                  - pdf
                  - image
                file:
                  type: string
                  format: binary
              required:
              - restaurant_id
              - source_kind
              - file
  /menu-imports/{import_id}:
    get:
      operationId: getMenuImport
      tags:
      - Администрирование меню
      summary: Статус загрузки меню
      description: ' Доступ: только admin; роль проверяется сервером.'
      x-service: catalog
      x-roles:
      - admin
      responses:
        '200':
          description: Операция выполнена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuImport'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
        '403':
          $ref: '#/components/responses/Error403'
      parameters:
      - name: import_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /menu-imports/{import_id}/draft:
    get:
      operationId: getMenuDraft
      tags:
      - Администрирование меню
      summary: Посмотреть извлечённый черновик
      description: 'Доступен в состоянии needs_review. Доступ: только admin; роль проверяется сервером.'
      x-service: catalog
      x-roles:
      - admin
      responses:
        '200':
          description: Операция выполнена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuDraft'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '403':
          $ref: '#/components/responses/Error403'
      parameters:
      - name: import_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: replaceMenuDraft
      tags:
      - Администрирование меню
      summary: Исправить черновик меню
      description: ' Доступ: только admin; роль проверяется сервером.'
      x-service: catalog
      x-roles:
      - admin
      responses:
        '200':
          description: Операция выполнена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuDraft'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '403':
          $ref: '#/components/responses/Error403'
      parameters:
      - name: import_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MenuDraftReplace'
  /menu-imports/{import_id}/publish:
    post:
      operationId: publishMenu
      tags:
      - Администрирование меню
      summary: Опубликовать проверенную версию меню
      description: 'Транзакционно создаёт новую версию, блюда и позиции; архивирует прежнюю активную версию. Обязательны
        название и цена каждой позиции, валидная валюта; нутриенты могут быть неизвестны. existing_dish_id должен
        принадлежать тому же ресторану. Повторная публикация уже опубликованного импорта даёт 409. Доступ: только
        admin; роль проверяется сервером.'
      x-service: catalog
      x-roles:
      - admin
      responses:
        '201':
          description: Операция выполнена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuResponse'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '403':
          $ref: '#/components/responses/Error403'
      parameters:
      - name: import_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MenuPublishRequest'
  /nutrition/calculate:
    post:
      operationId: calculateMeal
      tags:
      - Питание
      summary: Посчитать цену и КБЖУ набора
      description: Сервер получает данные позиций из Catalog. Только позиции одного ресторана, одной версии меню
        и одной валюты. КБЖУ = значение на порцию × portions. Цена округляется до минимальных единиц валюты. Неизвестные
        нутриенты не считаются нулевыми.
      x-service: users
      x-roles:
      - user
      - admin
      responses:
        '200':
          description: Операция выполнена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MealCalculation'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
        '503':
          $ref: '#/components/responses/Error503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MealCalculateRequest'
  /me/diary:
    get:
      operationId: listDiary
      tags:
      - Дневник
      summary: Записи за выбранный день
      description: День определяется в timezone профиля. Записи видны только владельцу.
      x-service: users
      x-roles:
      - user
      - admin
      responses:
        '200':
          description: Операция выполнена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiaryPage'
        '401':
          $ref: '#/components/responses/Error401'
        '422':
          $ref: '#/components/responses/Error422'
      parameters:
      - *id001
      - *id002
      - name: date
        in: query
        required: true
        schema:
          type: string
          format: date
    post:
      operationId: createDiaryEntry
      tags:
      - Дневник
      summary: Записать съеденную порцию
      description: Только после явного подтверждения в приложении. Создаёт неизменяемый снимок состава, пищевой
        ценности и версии меню. Для ручного ввода source=user_entered. Повтор с тем же Idempotency-Key возвращает
        ту же запись без дубля.
      x-service: users
      x-roles:
      - user
      - admin
      responses:
        '201':
          description: Операция выполнена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiaryEntry'
        '401':
          $ref: '#/components/responses/Error401'
