components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
      description: Уникальный ключ логической операции. Повтор с тем же ключом и телом возвращает прежний результат;
        другой payload даёт 409. Ключ хранится вместе с записью и ограничен пользователем и endpoint.
  responses:
    Error400:
      description: Некорректный запрос.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: error400
            message: Некорректный запрос.
            request_id: 00000000-0000-4000-8000-000000000099
            details: []
    Error401:
      description: Требуется действующий Bearer JWT.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: error401
            message: Требуется действующий Bearer JWT.
            request_id: 00000000-0000-4000-8000-000000000099
            details: []
    Error403:
      description: Недостаточно прав.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: error403
            message: Недостаточно прав.
            request_id: 00000000-0000-4000-8000-000000000099
            details: []
    Error404:
      description: Объект не найден или не принадлежит пользователю.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: error404
            message: Объект не найден или не принадлежит пользователю.
            request_id: 00000000-0000-4000-8000-000000000099
            details: []
    Error409:
      description: Конфликт состояния, версии или Idempotency-Key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: error409
            message: Конфликт состояния, версии или Idempotency-Key.
            request_id: 00000000-0000-4000-8000-000000000099
            details: []
    Error422:
      description: Ошибка проверки полей или бизнес-ограничений.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: error422
            message: Ошибка проверки полей или бизнес-ограничений.
            request_id: 00000000-0000-4000-8000-000000000099
            details: []
    Error429:
      description: Превышен лимит запросов.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: error429
            message: Превышен лимит запросов.
            request_id: 00000000-0000-4000-8000-000000000099
            details: []
    Error503:
      description: Сервис или модель временно недоступны.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: error503
            message: Сервис или модель временно недоступны.
            request_id: 00000000-0000-4000-8000-000000000099
            details: []
  schemas:
    Error:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
          format: uuid
        details:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              field:
                type: string
              message:
                type: string
            required:
            - message
      required:
      - code
      - message
      - request_id
    Point:
      type: object
      additionalProperties: false
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
          example: 55.7558
        longitude:
          type: number
          minimum: -180
          maximum: 180
          example: 37.6173
      required:
      - latitude
      - longitude
    Near:
      type: object
      additionalProperties: false
      properties:
        point:
          $ref: '#/components/schemas/Point'
        radius_m:
          type: integer
          minimum: 100
          maximum: 100000
          example: 2000
      required:
      - point
      - radius_m
    User:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          enum:
          - user
          - admin
        created_at:
          type: string
          format: date-time
      required:
      - id
      - email
      - role
      - created_at
    RegisterRequest:
